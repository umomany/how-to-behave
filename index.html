<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لعبة: كيف أتصرّف؟</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#23303B;--soft:#5A6672;--line:#E2E5E1;--paper:#fff;--bg:#EFF1EE;
--clay:#E0794A;--sea:#3C7FB8;--leaf:#3E9D7A;--plum:#7C6BC4;--rose:#CE6389;--sun:#DFA22B;--ember:#CE564E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Noto Kufi Arabic","Segoe UI",Tahoma,sans-serif;font-size:16px;line-height:1.7}
.wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:9px 12px}
.brand{font-weight:700;font-size:18px}
.tools{display:flex;gap:7px;flex-wrap:wrap}
button{font-family:inherit;font-size:15px;cursor:pointer;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:8px 14px;transition:transform .12s ease,background .15s}
button:active{transform:scale(.97)}
button:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.tool{font-size:14px;padding:7px 12px}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:18px;margin-top:14px}
h1{font-size:28px;margin:0 0 6px;line-height:1.35}
h2{font-size:21px;margin:0 0 8px}
p{margin:0 0 10px}
.muted{color:var(--soft)}
.art{border-radius:18px;overflow:hidden;background:var(--tint,#F2F4F1)}
.art svg{display:block;width:100%;height:auto}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:right;padding:14px 16px;border:2px solid var(--line);border-radius:18px;font-size:17px;line-height:1.6}
.opt:hover{background:#F7F8F6}
.opt.good{border-color:var(--leaf);background:#E9F5F0}
.opt.bad{border-color:var(--ember);background:#FBECEA}
.opt[disabled]{cursor:default;opacity:.75}
.opt.good[disabled],.opt.bad[disabled]{opacity:1}
.fb{margin-top:14px;border-radius:18px;padding:14px 16px;border:1px solid var(--line);background:#F7F8F6}
.fb h3{margin:0 0 4px;font-size:18px}
.fb.win h3{color:var(--leaf)} .fb.miss h3{color:var(--ember)}
.tip{font-family:"Amiri",serif;font-size:17px;color:var(--soft);border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px}
.big{background:var(--sea);color:#fff;border-color:var(--sea);font-size:18px;font-weight:700;padding:13px 26px;border-radius:18px}
.big.leaf{background:var(--leaf);border-color:var(--leaf)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chips span{background:#F1F3F0;border-radius:20px;padding:6px 13px;font-size:15px;font-weight:500}
.worlds{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:14px}
.world{text-align:right;padding:0;overflow:hidden;border:2px solid var(--line);border-radius:20px;background:var(--paper)}
.world .lbl{padding:12px 15px}
.world h3{margin:0;font-size:18px;color:var(--hue)}
.stars{font-size:15px;color:var(--sun);letter-spacing:2px}
.prog{display:flex;gap:5px;margin-bottom:10px}
.prog i{height:7px;flex:1;border-radius:4px;background:#E7EAE6}
.prog i.on{background:var(--sun)}
.note{font-size:14px;color:var(--soft)}
input[type=text]{font-family:inherit;font-size:16px;padding:11px 14px;border-radius:14px;border:1px solid var(--line);width:220px}
.cert{border:3px double var(--sun);border-radius:22px;padding:26px;text-align:center}
.cert .name{font-family:"Amiri",serif;font-size:30px;font-weight:700;margin:8px 0}
.hide{display:none}
@media print{.bar,.tools,.row,.note{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap">

  <div class="bar">
    <span class="brand">كيف أتصرّف؟</span>
    <div class="tools">
      <button class="tool" id="btnLang" onclick="toggleLang()">كلمات سهلة</button>
      <button class="tool" id="btnSound" aria-pressed="true" onclick="toggleSound()">الصوت يعمل</button>
      <button class="tool" onclick="openTool('voice')">إعدادات الصوت</button>
      <button class="tool" onclick="goMap()">الخريطة</button>
    </div>
  </div>

  <div id="screen"></div>
  <p class="note" id="voiceNote"></p>
</div>

/* ---------- speech ---------- */
let voices = [], chosenVoice = null, primed = false, resumeTimer = null;
const SS = window.speechSynthesis || null;

function loadVoices(){
  if (!SS) return;
  voices = SS.getVoices() || [];
  if (!chosenVoice) chosenVoice = pickArabic();
}
function isArabic(v){
  return /^ar/i.test(v.lang || "") || /arab|عرب|majed|maged|laila|layla|tarik|hala|salma|amira|hamed|zariyah|naayf/i.test(v.name || "");
}
function pickArabic(){ return voices.find(isArabic) || null; }
function primeSpeech(){
  if (primed || !SS) return;
  primed = true;
  try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; SS.speak(u); } catch(e){}
  loadVoices();
  setTimeout(loadVoices, 400);
}
if (SS){ loadVoices(); SS.onvoiceschanged = loadVoices; }
document.addEventListener("pointerdown", primeSpeech, { once:true, capture:true });
document.addEventListener("keydown", primeSpeech, { once:true, capture:true });

function noteEl(){ return document.getElementById("voiceNote"); }
function say(msg){ const n = noteEl(); if (n) n.textContent = msg; }

const AUDIO_DIR = "audio/";
let audioEl = null, audioWorks = null, audioFails = 0;
function fnv(str){
  let h = 0x811c9dc5;
  for (const c of new TextEncoder().encode(str)) h = Math.imul(h ^ c, 0x01000193) >>> 0;
  return h.toString(16).padStart(8, "0");
}
// Once a clip has played, later failures are transient (flaky mobile data) — fall
// back for that utterance only. Give up on the mp3s entirely just when none ever played.
function audioFailed(txt){
  if (audioWorks !== true && ++audioFails >= 3) audioWorks = false;
  ttsSpeak(txt);
}
function speak(txt){
  if (!state.sound) return;
  stopSpeech();
  if (audioWorks === false) return ttsSpeak(txt);
  if (!audioEl){ audioEl = new Audio(); audioEl.preload = "auto"; }
  audioEl.onerror = () => audioFailed(txt);
  audioEl.src = AUDIO_DIR + fnv(txt) + ".mp3";
  const pr = audioEl.play();
  if (pr && pr.then) pr.then(() => { audioWorks = true; audioFails = 0; say(""); })
                       .catch(() => audioFailed(txt));
}
function ttsSpeak(txt){
  if (!state.sound) return;
  if (!SS){ say("هذا المتصفّح لا يدعم القراءة الصوتية. جرّب Chrome أو Safari أو Edge."); return; }
  primeSpeech(); loadVoices();
  if (!voices.length){ say("لم يعثر المتصفّح على أي صوت. افتح «إعدادات الصوت» من الأعلى لمعرفة السبب."); }
  SS.cancel();
  setTimeout(() => {
    const u = new SpeechSynthesisUtterance(txt);
    if (chosenVoice){ u.voice = chosenVoice; u.lang = chosenVoice.lang || "ar"; } else { u.lang = "ar-SA"; }
    let started = false;
    setTimeout(() => { if (!started && !SS.speaking) say("لم يبدأ النطق. غالبًا لا يوجد محرّك نطق في النظام — افتح «إعدادات الصوت» لمعرفة الخطوات."); }, 1500);
    u.rate = 0.9; u.pitch = 1.05; u.volume = 1;
    u.onstart = () => { started = true; say(""); };
    u.onerror = e => {
      const why = (e && e.error) || "";
      say(why === "not-allowed"
        ? "منع المتصفّح تشغيل الصوت هنا. حمّل الملف وافتحه مباشرة في المتصفّح بدل المعاينة المضمّنة."
        : "تعذّر تشغيل الصوت. افتح «إعدادات الصوت» من الأعلى وجرّب صوتًا آخر.");
    };
    try { SS.speak(u); } catch(e){ say("تعذّر تشغيل الصوت في هذه النافذة."); }
    clearInterval(resumeTimer);
    resumeTimer = setInterval(() => { if (SS.speaking) SS.resume(); else clearInterval(resumeTimer); }, 6000);
  }, 130);
}
function stopSpeech(){
  if (SS) SS.cancel();
  if (audioEl){ try { audioEl.pause(); audioEl.currentTime = 0; } catch(e){} }
}
function setVoice(i){ chosenVoice = voices[i] || null; speak(state.lang ? "جرّب، هيك بيصير صوتي" : "تجربة: هكذا سيكون صوتي"); }
function inFrame(){ try { return window.top !== window.self; } catch(e){ return true; } }

/* ---------- controls ---------- */
function toggleLang(){ state.lang = state.lang ? 0 : 1; stopSpeech(); render(); }
function toggleSound(){
  state.sound = !state.sound; stopSpeech();
  const b = document.getElementById("btnSound");
  b.setAttribute("aria-pressed", state.sound);
  b.textContent = state.sound ? "الصوت يعمل" : "الصوت متوقف";
}
function goMap(){ stopSpeech(); state.screen = "map"; render(); }
function startGame(){
  const el = document.getElementById("nameIn");
  if (el) state.name = el.value.trim();
  goMap();
}
function openWorld(w){ stopSpeech(); state.world = w; state.qi = 0; state.picked = -1; state.screen = "play"; render(); }
function qid(w,i){ return w + "-" + i; }

function pick(i){
  const q = Q[state.world][state.qi];
  if (state.picked > -1 && state.picked === q.ok) return;
  const id = qid(state.world, state.qi);
  if (!(id in state.first)) state.first[id] = (i === q.ok);
  state.picked = i;
  render();
  const good = i === q.ok;
  speak(t(q.w[i]));
}
function next(){
  stopSpeech(); state.picked = -1;
  if (state.qi < Q[state.world].length - 1){ state.qi++; state.screen = "play"; }
  else state.screen = "worlddone";
  render();
}
function worldStars(w){ return Q[w].reduce((n,_,i) => n + (state.first[qid(w,i)] ? 1 : 0), 0); }
function totalStars(){ return Q.reduce((n,_,w) => n + worldStars(w), 0); }
function allDone(){ return Q.every((qs,w) => qs.every((_,i) => qid(w,i) in state.first)); }
function finish(){ stopSpeech(); state.screen = "cert"; render(); }
function restart(){ state.first = {}; state.qi = 0; state.picked = -1; goMap(); }

/* ---------- render ---------- */
function render(){
  document.getElementById("btnLang").textContent = state.lang ? "العربية الفصحى" : "كلمات سهلة";
  const s = document.getElementById("screen");

  s.innerHTML = ({ start:vStart, map:vMap, play:vPlay, worlddone:vWorldDone, cert:vCert, tool:vTool })[state.screen]();
  window.scrollTo({ top:0, behavior:"smooth" });
  if (state.screen === "tool" && state.tool === "calm") startBreath();
}

function vPlay(){
  const w = WORLDS[state.world], list = Q[state.world], q = list[state.qi];
  const bars = list.map((_,i) => `<i class="${i <= state.qi ? "on" : ""}"></i>`).join("");
  const opts = q.o.map((o,i) => {
    let cls = "opt";
    if (state.picked > -1){
      if (i === state.picked) cls += (i === q.ok ? " good" : " bad");
      else if (state.picked !== q.ok && i === q.ok && state.picked > -1) cls += "";
    }
    const dis = state.picked === q.ok ? "disabled" : "";
    return `<button class="${cls}" ${dis} onclick="pick(${i})">${t(o)}</button>`;
  }).join("");
  let fb = "";
  if (state.picked > -1){
    const good = state.picked === q.ok;
    fb = `<div class="fb ${good ? "win" : "miss"}" role="status">
      <h3>${good ? t(UI.win) : t(UI.miss)}</h3>
      <p>${t(q.w[state.picked])}</p>
      ${good ? `<p class="tip">${t(q.tip)}</p>` : `<p class="muted">${t(UI.best)}«${t(q.o[q.ok])}»</p>`}
      <div class="row">
        ${good ? `<button class="big leaf" onclick="next()">${t(UI.next)}</button>`
               : `<button class="big" onclick="retry()">${t(UI.again)}</button>`}
        <button onclick="speak(${JSON.stringify(t(q.w[state.picked])).replace(/"/g,"&quot;")})">${t(UI.listen)}</button>
      </div></div>`;
  }
  const readAll = t(q.q) + ". " + q.o.map(o => t(o)).join(". ");
  return `<div class="card" style="--hue:${w.hue}">
    <div class="prog">${bars}</div>
    <div class="art" style="--tint:${w.tint}">${ART[q.art]}</div>
    <h2 style="margin-top:14px">${t(q.q)}</h2>
    <div class="row" style="margin-top:0">
      <button onclick="speak(${JSON.stringify(readAll).replace(/"/g,"&quot;")})">${t(UI.listen)}</button>
      <span class="muted">${ar(state.qi+1)} ${t(UI.of)} ${ar(list.length)}</span>
    </div>
    <div class="opts">${opts}</div>
    ${fb}</div>`;
}
function retry(){ state.picked = -1; stopSpeech(); render(); }

function openTool(k){
  stopSpeech(); state.tool = k; state.screen = "tool";
  if (k === "mission" && !state.mis.length){
    const idx = MISSIONS.map((_,i) => i).sort(() => Math.random() - .5).slice(0,3);
    state.mis = idx;

function nextAff(){ state.aff = (state.aff + 1) % AFFIRM.length; render(); speak(t(AFFIRM[state.aff][0])); }
function doMission(i){ state.misDone[i] = true; render(); }
function missionStars(){ return Object.keys(state.misDone).length; }
function esc(x){ return JSON.stringify(x).replace(/"/g,"&quot;"); }

function startBreath(){
  const steps = [[t(UI.calm_in),4],[t(UI.calm_hold),4],[t(UI.calm_out),6]];
  let round = 0, si = 0, left = steps[0][1];
  const label = document.getElementById("bLabel"), num = document.getElementById("bNum"), ball = document.getElementById("bBall");
  if (!label) return;
  const paint = () => {
    label.textContent = steps[si][0]; num.textContent = ar(left);
    ball.style.transform = "scale(" + (si === 0 ? 1.35 : si === 1 ? 1.35 : .75) + ")";
  };
  speak(steps[0][0]); paint();
  breathTimer = setInterval(() => {
    left--;
    if (left <= 0){
      si++;
      if (si >= steps.length){ si = 0; round++; }
      if (round >= 3){
        clearInterval(breathTimer); breathTimer = null;
        label.textContent = t(UI.calm_done); num.textContent = "★"; ball.style.transform = "scale(1)";
        speak(t(UI.calm_done)); return;
      }
      left = steps[si][1]; speak(steps[si][0]);
    }
    paint();
  }, 1000);
}

      <li>على لينكس: كروم يأخذ الأصوات من speech-dispatcher في النظام. ثبّت المحرّك العربي بالأمر: sudo apt install speech-dispatcher speech-dispatcher-espeak-ng espeak-ng espeak-ng-data — ثم أغلق كروم وافتحه من جديد. للتجربة من الطرفية: spd-say -o espeak-ng -l ar "مرحبا".</li>
      <li>إن ظهرت أصوات بلا اسم لغة، اختر من القائمة أعلاه الصوت المكتوب فيه Arabic ثم اضغط «جرّب الصوت».</li>
    </ul>`;
    return `<div class="card" style="--hue:#3C7FB8">
      <h2>${t(UI.t_voice)}</h2>
      <div class="fb"><h3>${t(UI.v_state)}</h3>${rows}</div>
      ${voices.length ? `<p class="muted" style="margin-top:12px">${t(UI.v_pick)}</p>
        <select onchange="setVoice(this.value)" style="font-family:inherit;font-size:15px;padding:10px;border-radius:14px;border:1px solid var(--line);max-width:100%">${opts}</select>` : ""}
      <div class="row"><button class="big" onclick="speak(${esc(testTxt)})">${t(UI.v_test)}</button></div>
      ${help}${back}</div>`;
  }
  const list = DUAS.map(d => `<div class="fb" style="margin-top:10px">
      <h3 class="tip" style="border:0;margin:0;padding:0;font-size:20px;color:var(--ink)">${t(d.d)}</h3>
      <p class="muted" style="margin:6px 0 0">${t(UI.when)}: ${t(d.w)}</p>
      <p style="margin:2px 0 0">${t(d.m)}</p>
      <div class="row" style="margin-top:8px"><button onclick="speak(${esc(t(d.d))})">${t(UI.listen)}</button></div>
    </div>`).join("");
  return `<div class="card" style="--hue:#3E9D7A">
    <div class="art" style="--tint:#E4F2EC">${ART.shield}</div>
    <h2 style="margin-top:14px">${t(UI.t_dua)}</h2>
    <p class="muted">${t(UI.dua_p)}</p>${list}${back}</div>`;
}
function vWorldDone(){
  const w = WORLDS[state.world], st = worldStars(state.world), tot = Q[state.world].length;
  const ph = t(PRACTICE[state.world]).map(p =>
    `<span onclick="speak('${p}')" style="cursor:pointer">${p}</span>`).join("");
  return `<div class="card" style="--hue:${w.hue}">
    <div class="art" style="--tint:${w.tint}">${ART.salam}</div>
    <h2 style="margin-top:14px">${t(UI.done_h)}: ${t(w.name)}</h2>
    <p class="stars" style="font-size:22px">${"★".repeat(st)}${"☆".repeat(tot-st)}</p>
    <h3 style="margin:12px 0 0;font-size:17px">${t(UI.practice)}</h3>
    <div class="chips">${ph}</div>
    <div class="row"><button class="big" onclick="goMap()">${t(UI.back)}</button></div>
  </div>`;
}
function vCert(){
  const n = state.name || (state.lang ? "بطل الأخلاق" : "صاحب الخُلق الحسن");
  return `<div class="card"><div class="cert">
    <h2>${t(UI.cert_h)}</h2>
    <div class="name">${n}</div>
    <p>${t(UI.cert_p)} ${ar(totalStars() + missionStars())} ${t(UI.star_w)}</p>
    <p class="muted" style="margin:0">${t(UI.badges)}</p>
    <div class="chips" style="justify-content:center">${
      BADGES.map((b,i) => worldStars(i) >= Math.ceil(Q[i].length * .6) ? `<span>${t(b)}</span>` : "").join("")
    }</div>
    <p class="tip" style="border:0">«إنّ من أحبّكم إليّ أحاسنكم أخلاقًا»</p>
  </div>
  <div class="row">
    <button class="big leaf" onclick="window.print()">${t(UI.print)}</button>
    <button onclick="restart()">${t(UI.restart)}</button>
  </div></div>`;
}
render();
</script>
</body>
</html>
